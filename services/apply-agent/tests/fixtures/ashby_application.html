<!doctype html>
<!-- Stand-in for an Ashby-style form: yes/no questions are buttons, not radios. -->
<html><head><meta charset="utf-8"><title>Application - Ashby Co</title>
<style>[hidden]{display:none!important} .selected{font-weight:bold}</style></head>
<body>
<form id="f">
  <div><label for="name">Name *</label><input id="name" type="text" required></div>
  <div><label for="email">Email *</label><input id="email" type="email" required></div>
  <div><label for="cv">Resume *</label><input id="cv" type="file" required></div>
  <div class="q">
    <label>Are you legally authorized to work in the United States? *</label>
    <div class="yesno"><button type="button">Yes</button><button type="button">No</button></div>
  </div>
  <button type="submit">Submit Application</button>
</form>
<div id="done" hidden><p>Your application was submitted. We'll be in touch.</p></div>
<script>
  let auth = null;
  document.querySelectorAll('.yesno button').forEach(b => b.onclick = () => {
    document.querySelectorAll('.yesno button').forEach(x => x.classList.remove('selected'));
    b.classList.add('selected'); auth = b.textContent;
  });
  document.getElementById('f').onsubmit = e => {
    e.preventDefault();
    window.submitted = { name: document.getElementById('name').value, auth,
                         cv: document.getElementById('cv').files.length };
    document.getElementById('f').hidden = true; document.getElementById('done').hidden = false;
  };
</script>
</body></html>
