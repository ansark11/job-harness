<!doctype html>
<!-- The application form itself lives in a modal: it must never be dismissed. -->
<html><head><meta charset="utf-8"><title>Apply - Modal Co</title></head>
<body>
<div role="dialog" aria-modal="true" id="m">
  <button aria-label="Close">×</button>
  <form>
    <label for="a">First Name</label><input id="a">
    <label for="b">Last Name</label><input id="b">
    <label for="c">Email</label><input id="c" type="email">
    <label for="d">Phone</label><input id="d" type="tel">
    <button type="submit">Submit</button>
  </form>
</div>
</body></html>
