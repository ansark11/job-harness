<!doctype html>
<!-- Like NCC (JazzHR): a visible reCAPTCHA v2 "I'm not a robot" checkbox on the form. -->
<html><head><meta charset="utf-8"><title>Apply - Checkbox Captcha Co</title></head>
<body>
<form novalidate>
  <label for="fn">First Name *</label><input id="fn" type="text" required>
  <label for="em">Email *</label><input id="em" type="email" required>
  <div class="g-recaptcha"><iframe title="reCAPTCHA" width="304" height="78"
       src="about:blank#https://www.google.com/recaptcha/api2/anchor?ar=1&k=x&size=normal"></iframe></div>
  <button type="submit">Submit application</button>
</form>
</body></html>
